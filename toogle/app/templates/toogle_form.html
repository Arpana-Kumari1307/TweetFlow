{% extends "layout.html" %}

{% block title %}
Welcome toggle
{% endblock %}

{% block content %}
<h1 class="text-center text-white mt-4">Welcome to TweetFlow created by Arpana Mishra</h1>
<h2>
    {%if form.instance.pk %}
    Edit Tweet
    {% else %}
    Create Tweet
    {% endif %}
    <form method="post" enctype="multipart/form-data"
    class="form">
    {% csrf_token %}
    {{form.as_p}}
    <button class="btn btn-warning" type="submit">Submit</button>
</form>
<a href="{% url 'toogle_list' %}">Back to tweet list</a>
</h2>
{% endblock %}
